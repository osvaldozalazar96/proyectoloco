<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso / Registro</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #2c3e50; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 0;
        }
        .login-box { 
            background: #34495e; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 400px; 
            box-sizing: border-box;
        }
        h1 { text-align: center; color: #ecf0f1; margin-bottom: 30px; }
        label { display: block; margin: 15px 0 5px; font-size: 14px; color: #bdc3c7;}
        input[type="text"], input[type="email"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        input[type="submit"] { 
            width: 100%; 
            padding: 12px; 
            margin-top: 30px; 
            background-color: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover { background-color: #219150; }

        /* Estilos para el botón de Iniciar Sesión */
        .btn-secundario {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #2980b9;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }
        .btn-secundario:hover { background-color: #2471a3; }
        .separador {
            text-align: center;
            margin: 20px 0 10px;
            color: #bdc3c7;
            font-size: 14px;
        }

        .note { font-size: 12px; color: #95a5a6; margin-top: 15px; text-align: center;}
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Crear Cuenta / Acceso</h1>
        <form action="/index/" method="post">
            {% csrf_token %}
            
            <label for="nombre_apellido">Nombre y Apellido:</label>
            <input type="text" id="nombre_apellido" name="nombre_apellido" placeholder="Ej: Juan Pérez" required>

            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" placeholder="Tu nombre de usuario" required>

            <label for="gmail">Correo Gmail:</label>
            <input type="email" id="gmail" name="gmail" placeholder="tu_correo@gmail.com" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" 
                   placeholder="Mínimo 8 caracteres" 
                   required 
                   minlength="8" 
                   title="La contraseña debe tener al menos 8 caracteres">

            <input type="submit" value="Registrarse">
        </form>

        <!-- Botón para redirigir al Login -->
        <div class="separador">¿Ya tienes una cuenta?</div>
        <a href="{% url 'login2' %}" class="btn-secundario">Iniciar Sesión</a>

        <p class="note">Tus datos están protegidos y encriptados.</p>
    </div>
</body>
</html>
